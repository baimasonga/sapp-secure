name: Android build

on:
  pull_request:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.44.8'

jobs:
  debug-apk:
    name: Debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Run the native unit tests
        # The notification guard and the interrupt filter decide what the
        # listener is allowed to read. They are written free of Android types
        # precisely so that decision can be tested here rather than only on a
        # device.
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest

      - name: Check the source manifest declares no sensitive permissions
        # INTERNET is for optional sign-in and reporting. POST_NOTIFICATIONS
        # lets the app tell you a message is worth checking; the notification
        # it posts contains no message text. Reading other apps' notifications
        # is not a uses-permission at all — it is the bind guard on the
        # listener service, checked separately below.
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          UNEXPECTED=$(grep -oE 'android:name="android\.permission\.[A-Z_]+"' "$MANIFEST" \
            | grep -vE 'android.permission.(INTERNET|POST_NOTIFICATIONS)' || true)
          if [ -n "$UNEXPECTED" ]; then
            echo "::error::Unexpected permissions declared in the manifest:"
            echo "$UNEXPECTED"
            exit 1
          fi

      - name: Check the notification listener stays behind the system bind guard
        # A listener service without this attribute could be bound by any
        # application on the device. An accessibility service must never
        # appear here at all: the specification rules it out, and it is the
        # single most abusable capability an app of this kind could ask for.
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          grep -q 'android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE"' "$MANIFEST" \
            || (echo "::error::The notification listener is not guarded by the system bind permission." && exit 1)
          if grep -q 'BIND_ACCESSIBILITY_SERVICE\|accessibilityservice' "$MANIFEST"; then
            echo "::error::An accessibility service was declared. Section 14 forbids this."
            exit 1
          fi

      - name: Check the built APK requests nothing dangerous
        # The source manifest is only half the story: a plugin can add
        # permissions through manifest merging. This inspects what the shipped
        # APK actually asks for. Salone Shield must never request any of these
        # — the contact and photo pickers exist precisely so it does not have
        # to. Every permission found is printed, so additions are visible in
        # review even when they are harmless.
        run: |
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -r | head -1)
          if [ -z "$AAPT" ]; then
            echo "::error::aapt not found; cannot verify APK permissions."
            exit 1
          fi
          PERMS=$("$AAPT" dump permissions build/app/outputs/flutter-apk/app-debug.apk \
            | grep -oE 'android\.permission\.[A-Z_]+' | sort -u || true)
          echo "Permissions in the APK:"
          echo "$PERMS"
          # BIND_NOTIFICATION_LISTENER_SERVICE stays on the list: it belongs
          # on the service element as a guard, never as a permission the app
          # requests for itself.
          FORBIDDEN='READ_CONTACTS|WRITE_CONTACTS|READ_SMS|RECEIVE_SMS|SEND_SMS|READ_PHONE_STATE|READ_CALL_LOG|RECORD_AUDIO|CAMERA|ACCESS_FINE_LOCATION|ACCESS_COARSE_LOCATION|READ_EXTERNAL_STORAGE|WRITE_EXTERNAL_STORAGE|READ_MEDIA_IMAGES|SYSTEM_ALERT_WINDOW|BIND_ACCESSIBILITY_SERVICE'
          MATCHES=$(echo "$PERMS" | grep -E "$FORBIDDEN" || true)
          if [ -n "$MATCHES" ]; then
            echo "::error::The APK requests permissions Salone Shield must not have:"
            echo "$MATCHES"
            exit 1
          fi

      - name: Confirm backups stay disabled
        run: grep -q 'android:allowBackup="false"' android/app/src/main/AndroidManifest.xml

      - uses: actions/upload-artifact@v4
        with:
          name: salone-shield-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

  release-bundle:
    name: Release app bundle
    # Release builds only on the default branch; pull requests get the debug
    # build, which is what reviewers need.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Validate the version number
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          echo "Version: $VERSION"
          echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+\+[0-9]+$' \
            || (echo "::error::pubspec version must look like 1.2.3+4" && exit 1)

      - name: Build release bundle
        # Unsigned: no signing material is stored in the repository. Signing
        # happens in the release pipeline with secrets held outside CI config.
        run: |
          flutter build appbundle --release \
            --dart-define=APP_ENV=production \
            --dart-define=ENABLE_ANALYTICS=false \
            --dart-define=ENABLE_NOTIFICATION_MONITORING=false \
            --dart-define=ENABLE_EXTERNAL_URL_REPUTATION=false

      - uses: actions/upload-artifact@v4
        with:
          name: salone-shield-release-bundle
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 14
