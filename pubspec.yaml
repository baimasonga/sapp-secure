name: salone_shield
description: "Salone Shield — a privacy-first WhatsApp scam-protection companion for Sierra Leone."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^10.3.1
  go_router: ^17.3.0
  intl: ^0.20.2
  shared_preferences: ^2.5.5
  supabase_flutter: ^2.16.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_secure_storage_platform_interface: ^2.0.2

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/scam_rules/
